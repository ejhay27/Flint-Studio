name: Flint Test Lab

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci || npm install
      - run: npx tsc -b
      - run: npm run build
      - run: npm run test:unit

  browser:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci || npm install
      # SwiftShader provides software WebGL so functional rendering tests can run
      # on CI runners without a physical GPU. These are not GPU benchmarks.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: always()
      - name: Inspect exported media (FFprobe)
        if: always()
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          mkdir -p test-results/media
          find test-results -name '*.webm' -print -exec cp {} test-results/media/ \; || true
          for f in test-results/media/*.webm; do
            [ -e "$f" ] || { echo "no exported webm found"; continue; }
            ffprobe -v error -show_entries format=duration,format_name:stream=index,codec_name,codec_type,width,height,avg_frame_rate -of json "$f" | tee "$f.ffprobe.json"
            ffprobe -v error -select_streams v:0 -show_frames -show_entries frame=pts_time,pkt_duration_time -of csv "$f" | head -20 | tee "$f.frames.csv"
            ffmpeg -v error -i "$f" -f null - && echo "decode ok"
            ffmpeg -v error -i "$f" -vf "select=eq(n\,0)" -frames:v 1 "$f.frame0.png" || true
          done
        uses: actions/upload-artifact@v4
        with:
          name: flint-browser-report
          path: |
            test-results
            test-results/**
            playwright-report
          retention-days: 14
